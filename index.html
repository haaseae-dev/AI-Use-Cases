<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[working name] — real AI use cases, real builders</title>
<meta name="description" content="A running collection of real AI use cases — started at PMI 2026 by Xan Schutz & Brit Vorreiter, and still growing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F5FB;
    --card:#FFFFFF;
    --ink:#1C1A2E;
    --ink-soft:#6B6785;
    --border:#E5E3F2;
    --indigo:#5B4FE0; --indigo-tint:#EBE8FC;
    --coral:#E8543E;  --coral-tint:#FCE6E1;
    --mint:#12A594;   --mint-tint:#DDF3EF;
    --amber:#C98A2C;  --amber-tint:#F6EAD6;
    --sky:#2E86DE;    --sky-tint:#E2EEFC;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif;line-height:1.55;}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px;}
  a{color:var(--indigo);}
  header{padding:44px 0 8px;}
  .wordmark{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:28px;display:flex;align-items:center;gap:10px;}
  .wordmark .dot{width:11px;height:11px;border-radius:50%;background:var(--indigo);}
  .tagline{font-size:14.5px;color:var(--ink-soft);margin-top:8px;max-width:46ch;}
  .origin{font-size:12px;color:var(--ink-soft);margin-top:14px;}
  .origin a{color:var(--ink);font-weight:600;}

  /* ---------- search ---------- */
  .search-row{padding:26px 0 12px;}
  .search-box{position:relative;}
  .search-box input{
    width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px 12px 42px;font-size:14px;color:var(--ink);font-family:inherit;
  }
  .search-box input::placeholder{color:var(--ink-soft);}
  .search-box input:focus-visible{outline:2px solid var(--indigo);}
  .search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft);width:16px;height:16px;}

  /* ---------- filters ---------- */
  .filter-bar{display:flex;gap:12px;flex-wrap:wrap;padding:14px 0 6px;}
  .filter-field{display:flex;flex-direction:column;gap:5px;flex:1 1 180px;min-width:150px;}
  .filter-field label{font-size:11.5px;font-weight:700;color:var(--ink-soft);}
  .filter-field select{
    appearance:none;-webkit-appearance:none;
    background:var(--card) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%236B6785" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>') no-repeat right 12px center;
    border:1px solid var(--border);border-radius:10px;
    padding:10px 34px 10px 14px;font-size:13.5px;font-weight:600;color:var(--ink);
    font-family:inherit;cursor:pointer;width:100%;
  }
  .filter-field select:focus-visible{outline:2px solid var(--indigo);outline-offset:1px;}
  .filter-meta{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:13px;color:var(--ink-soft);}
  .filter-meta button{background:none;border:none;color:var(--indigo);font-size:13px;font-weight:600;cursor:pointer;padding:0;}

  #status-msg{font-size:13.5px;color:var(--ink-soft);padding:14px 0 0;}
  #status-msg.error{color:#9a5b12;}

  /* ---------- grid + list cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;padding:22px 0 70px;align-items:start;}
  .list-card{
    display:flex;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:16px;color:var(--ink);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;
  }
  .list-thumb{width:56px;height:56px;border-radius:10px;flex-shrink:0;object-fit:cover;}
  .list-thumb-placeholder{
    width:56px;height:56px;border-radius:10px;flex-shrink:0;border:1.5px dashed var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);background:var(--bg);
  }
  .list-thumb-placeholder svg{width:16px;height:16px;opacity:0.6;}
  .list-card-text{flex:1;min-width:0;}
  .list-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(28,26,46,0.06);}
  .list-card:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;}
  .cat-chip{align-self:flex-start;display:inline-block;font-weight:700;font-size:11px;padding:4px 11px;border-radius:999px;margin-bottom:11px;}
  .cat-chip.indigo{background:var(--indigo-tint);color:var(--indigo);}
  .cat-chip.coral{background:var(--coral-tint);color:var(--coral);}
  .cat-chip.mint{background:var(--mint-tint);color:#0C7A6D;}
  .cat-chip.amber{background:var(--amber-tint);color:#8A6320;}
  .cat-chip.sky{background:var(--sky-tint);color:#1B5FA8;}
  .cat-chip.neutral{background:var(--border);color:var(--ink-soft);}
  .list-title{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:700;margin:0 0 8px;line-height:1.3;}
  .list-body{font-size:13.5px;color:var(--ink-soft);margin:0 0 12px;line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .list-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;font-weight:600;margin-bottom:12px;}
  .chip{border:1px solid var(--border);padding:3px 10px;border-radius:999px;color:var(--ink-soft);}
  .list-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-soft);font-weight:600;
    border-top:1px solid var(--border);padding-top:12px;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:14px;grid-column:1/-1;}
  .empty-state button{margin-top:12px;background:var(--ink);color:var(--bg);border:none;padding:9px 18px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;}

  footer{border-top:1px solid var(--border);padding:26px 24px 60px;font-size:13px;color:var(--ink-soft);}

  /* ---------- detail view ---------- */
  #view-detail{display:none;padding:36px 0 80px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-soft);font-weight:600;
    margin-bottom:22px;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;}
  .back-link:hover{color:var(--ink);}
  .hero-shot{width:100%;max-height:360px;border-radius:16px;object-fit:cover;border:1px solid var(--border);cursor:zoom-in;display:block;}
  .carousel{position:relative;margin-bottom:12px;touch-action:pan-y;}
  .car-arrow{
    position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;
    background:rgba(255,255,255,0.92);border:1px solid var(--border);color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(28,26,46,0.12);
  }
  .car-arrow svg{width:18px;height:18px;}
  .car-prev{left:10px;} .car-next{right:10px;}
  .car-dots{display:flex;justify-content:center;gap:6px;margin:0 0 16px;}
  .car-dot{width:6px;height:6px;border-radius:50%;background:var(--border);border:none;padding:0;cursor:pointer;}
  .car-dot.active{background:var(--indigo);}
  .hero-placeholder{
    width:100%;aspect-ratio:16/7;border-radius:16px;margin-bottom:22px;background:var(--card);
    border:1.5px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;color:var(--ink-soft);font-size:13.5px;
  }
  .hero-placeholder svg{width:28px;height:28px;opacity:0.6;}
  .hero-placeholder .sub{font-size:11.5px;color:var(--ink-soft);opacity:0.8;}
  .image-caption{font-size:12px;color:var(--ink-soft);margin:0 0 16px;}

  .detail-title{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(22px,4vw,28px);font-weight:800;margin:2px 0 10px;line-height:1.25;}
  .detail-problem{font-size:15px;color:var(--ink-soft);max-width:62ch;margin:0 0 16px;}
  .detail-meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;}
  .meta-pill{background:var(--card);border:1px solid var(--border);color:var(--ink);font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;}

  .detail-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:14px;}
  .detail-card h4{font-size:11.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:var(--indigo);margin:0 0 8px;}
  .detail-card p{font-size:14px;color:var(--ink-soft);line-height:1.65;margin:0;white-space:pre-line;}

  .submitted-row{display:flex;align-items:center;gap:12px;padding-top:18px;margin-top:6px;border-top:1px solid var(--border);}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--indigo);color:#fff;font-family:'Bricolage Grotesque',sans-serif;
    font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .submitted-name{font-size:13.5px;font-weight:700;color:var(--ink);}
  .submitted-label{font-size:12px;color:var(--ink-soft);}
  .submitted-row a.li-link{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--indigo);display:flex;align-items:center;gap:4px;}

  .howto-toggle{
    background:var(--indigo);color:#fff;border:none;padding:12px 20px;border-radius:12px;
    font-size:13.5px;font-weight:700;cursor:pointer;width:100%;margin-top:2px;
  }
  .download-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--card);color:var(--indigo);border:1.5px solid var(--indigo);
    padding:11px 20px;border-radius:12px;font-size:13.5px;font-weight:700;
    width:100%;margin-top:10px;text-decoration:none;
  }
  .download-btn svg{width:16px;height:16px;flex-shrink:0;}
  .download-btn:hover{background:var(--indigo-tint);}
  .howto-panel{display:none;margin-top:14px;}
  .howto-panel.open{display:block;}
  .howto-content{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;}
  .howto-content h1,.howto-content h2,.howto-content h3{font-family:'Bricolage Grotesque',sans-serif;color:var(--ink);margin:18px 0 6px;}
  .howto-content h1{font-size:18px;} .howto-content h2{font-size:15.5px;} .howto-content h3{font-size:14px;}
  .howto-content h1:first-child,.howto-content h2:first-child{margin-top:0;}
  .howto-content p{font-size:13.5px;color:var(--ink-soft);line-height:1.65;margin:0 0 10px;}
  .howto-content ul,.howto-content ol{margin:0 0 10px;padding-left:20px;font-size:13.5px;color:var(--ink-soft);}
  .howto-content li{margin-bottom:4px;}
  .howto-content blockquote{margin:0 0 10px;padding:10px 14px;background:var(--indigo-tint);border-left:3px solid var(--indigo);border-radius:6px;font-size:13px;color:var(--ink);font-style:italic;}
  .howto-content hr{border:none;border-top:1px solid var(--border);margin:16px 0;}
  .howto-content a{font-weight:600;}

  .lightbox{position:fixed;inset:0;background:rgba(20,18,40,0.82);display:none;align-items:center;justify-content:center;padding:24px;z-index:50;cursor:zoom-out;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:10px;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .list-card.entrance{animation:fadeUp .35s ease both;}
  @media (prefers-reduced-motion: reduce){ .list-card.entrance{animation:none;} html{scroll-behavior:auto;} }

  @media (max-width:640px){
    .detail-card, .howto-content{padding:17px;border-radius:14px;}
  }
</style>
</head>
<body>

<!-- ================= LIST VIEW ================= -->
<section id="view-list">
  <div class="wrap">
    <header>
      <div class="wordmark"><span class="dot"></span>[working name]</div>
      <div class="tagline">Real tools, real builders, real AI — a running collection, not a portfolio.</div>
      <div class="origin">Started at PMI 2026 by <a href="https://www.linkedin.com/in/alexandra-schutz/" target="_blank" rel="noopener">Xan Schutz</a> &amp; <a href="https://www.linkedin.com/in/britvorreiter/" target="_blank" rel="noopener">Brit Vorreiter</a>. Still growing.</div>
    </header>

    <div class="search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="search-input" placeholder="Search use cases, tools, or people…">
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-field">
        <label for="f-type">Type</label>
        <select id="f-type"><option value="">Any type</option></select>
      </div>
      <div class="filter-field">
        <label for="f-time">Time you've got</label>
        <select id="f-time"><option value="">Any amount</option></select>
      </div>
    </div>
    <div class="filter-meta">
      <span id="result-count">Loading use cases…</span>
      <button id="clear-filters" type="button">Clear filters</button>
    </div>

    <div id="status-msg"></div>

    <div class="grid" id="grid"></div>
  </div>
  <footer>Have something worth adding? Tell Xan or Brit — new entries show up here automatically, no rebuild needed.</footer>
</section>

<!-- ================= DETAIL VIEW ================= -->
<section id="view-detail">
  <div class="wrap" id="detail-content"></div>
</section>

<div class="lightbox" id="lightbox"><img id="lightbox-img" src="" alt=""></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
(function(){
  var SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR32mpK71jkRASGdz7pGvYlSHdVZjklf8-YYKd76sVI-Bar-OOhbo9tA6hEfq4XhA/pub?gid=962151949&single=true&output=csv";

  var TIME_ORDER = ["Under 15 min", "15–60 min", "1–4 hrs", "4–8 hrs", "Days+"];
  var TYPE_COLORS = ["indigo", "coral", "mint", "amber", "sky"];
  var STORAGE_KEY = "usecases-cache-v4";

  // Optional: map an author's name to their LinkedIn URL, shown on the detail page.
  var AUTHOR_LINKS = {
    "Xan": "https://www.linkedin.com/in/alexandra-schutz/",
    "Brit": "https://www.linkedin.com/in/britvorreiter/"
  };

  var state = { type: "", time: "", q: "" };
  var allCases = [];
  var typeColorMap = {};

  var viewList = document.getElementById("view-list");
  var viewDetail = document.getElementById("view-detail");
  var detailContent = document.getElementById("detail-content");
  var gridEl = document.getElementById("grid");
  var statusEl = document.getElementById("status-msg");
  var countEl = document.getElementById("result-count");
  var typeSel = document.getElementById("f-type");
  var timeSel = document.getElementById("f-time");
  var searchInput = document.getElementById("search-input");
  var lightbox = document.getElementById("lightbox");
  var lightboxImg = document.getElementById("lightbox-img");

  function renderMarkdown(md){
    if (!md) return "";
    var lines = md.replace(/\r\n/g, "\n").split("\n");
    var html = []; var inList = null; var paraBuf = [];
    function inline(s){
      s = s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return s;
    }
    function flushPara(){ if (paraBuf.length){ html.push("<p>" + inline(paraBuf.join(" ")) + "</p>"); paraBuf = []; } }
    function closeList(){ if (inList){ html.push("</" + inList + ">"); inList = null; } }
    lines.forEach(function(raw){
      var line = raw.trim();
      if (line === ""){ flushPara(); closeList(); return; }
      if (/^---+$/.test(line)){ flushPara(); closeList(); html.push("<hr>"); return; }
      var h = line.match(/^(#{1,3})\s+(.*)$/);
      if (h){ flushPara(); closeList(); var lvl = h[1].length; html.push("<h" + lvl + ">" + inline(h[2]) + "</h" + lvl + ">"); return; }
      var bq = line.match(/^>\s?(.*)$/);
      if (bq){ flushPara(); closeList(); html.push("<blockquote>" + inline(bq[1]) + "</blockquote>"); return; }
      var ol = line.match(/^\d+\.\s+(.*)$/);
      if (ol){ flushPara(); if (inList !== "ol"){ closeList(); html.push("<ol>"); inList = "ol"; } html.push("<li>" + inline(ol[1]) + "</li>"); return; }
      var ul = line.match(/^[-*]\s+(.*)$/);
      if (ul){ flushPara(); if (inList !== "ul"){ closeList(); html.push("<ul>"); inList = "ul"; } html.push("<li>" + inline(ul[1]) + "</li>"); return; }
      closeList(); paraBuf.push(line);
    });
    flushPara(); closeList();
    return html.join("\n");
  }

  function splitList(str){ return (str || "").split(",").map(function(t){return t.trim();}).filter(Boolean); }

  function isPublishable(status){
    var s = (status || "").trim().toLowerCase();
    return s === "live" || s.indexOf("coming") !== -1;
  }
  function isComplete(r){
    return !!(r.Title && r.Title.trim() && r.Type && r.Type.trim() && r.Problem && r.Problem.trim()
      && r.Tools && r.Tools.trim() && r.TimeBucket && r.TimeBucket.trim());
  }

  function normalizeRows(rows){
    var hiddenIncomplete = 0, hiddenDraft = 0;
    var cases = rows.filter(function(r){ return r.Title && r.Title.trim(); }).filter(function(r){
      if (!isPublishable(r.Status)){ hiddenDraft++; return false; }
      if (!isComplete(r)){ hiddenIncomplete++; return false; }
      return true;
    }).map(function(r, i){
      return {
        id: "case-" + i,
        title: (r.Title || "").trim(),
        author: (r.Author || "").trim(),
        type: (r.Type || "").trim(),
        problem: (r.Problem || "").trim(),
        build: (r.Build || "").trim(),
        tools: splitList(r.Tools),
        level: (r.Level || "Intro").trim(),
        timeBucket: (r.TimeBucket || "").trim(),
        timeDetail: (r.TimeDetail || "").trim(),
        outcome: (r.Outcome || "").trim(),
        lessons: (r.Lessons || "").trim(),
        status: (r.Status || "").trim(),
        images: splitList(r.ImageURLs),
        imageLabel: (r["ImageURL-Label"] || "").trim(),
        howTo: (r.HowToGuide || "").trim(),
        howToLabel: (r["HowToGuide-Label"] || "").trim(),
        guideFileUrl: (r.PromptFileURL || "").trim(),
        guideFileLabel: (r["PromptFile-Label"] || "").trim()
      };
    });
    cases.hiddenIncomplete = hiddenIncomplete;
    cases.hiddenDraft = hiddenDraft;
    return cases;
  }

  function assignTypeColors(){
    var types = Array.from(new Set(allCases.map(function(c){ return c.type; }).filter(Boolean)));
    types.forEach(function(t, i){ typeColorMap[t] = TYPE_COLORS[i % TYPE_COLORS.length]; });
  }

  function populateSelect(sel, values, placeholder){
    sel.innerHTML = "";
    var opt0 = document.createElement("option"); opt0.value = ""; opt0.textContent = placeholder;
    sel.appendChild(opt0);
    values.forEach(function(v){ var o = document.createElement("option"); o.value = v; o.textContent = v; sel.appendChild(o); });
  }

  function setupFilters(){
    var types = Array.from(new Set(allCases.map(function(c){ return c.type; }).filter(Boolean))).sort();
    var times = TIME_ORDER.filter(function(t){ return allCases.some(function(c){ return c.timeBucket === t; }); });
    populateSelect(typeSel, types, "Any type");
    populateSelect(timeSel, times, "Any amount");
  }

  function matchesFilters(c){
    if (state.type && c.type !== state.type) return false;
    if (state.time && c.timeBucket !== state.time) return false;
    if (state.q){
      var hay = (c.title + " " + c.problem + " " + c.author + " " + c.tools.join(" ") + " " + c.type).toLowerCase();
      if (hay.indexOf(state.q.toLowerCase()) === -1) return false;
    }
    return true;
  }

  function listCardHTML(c, idx){
    var colorClass = typeColorMap[c.type] || "neutral";
    var typeChip = c.type ? '<span class="cat-chip ' + colorClass + '">' + c.type + '</span>' : "";
    var toolTags = c.tools.map(function(t){ return '<span class="chip">' + t + '</span>'; }).join("");
    var comingSoon = c.status && c.status.toLowerCase().indexOf("coming") !== -1 ? " · coming soon" : "";
    var thumb = c.images.length
      ? '<img class="list-thumb" src="' + c.images[0] + '" alt="">'
      : '<div class="list-thumb-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>';
    return (
      '<a class="list-card entrance" href="#/case/' + c.id + '" style="animation-delay:' + Math.min(idx * 25, 220) + 'ms">' +
        thumb +
        '<div class="list-card-text">' +
          typeChip +
          '<h3 class="list-title">' + c.title + '</h3>' +
          '<p class="list-body">' + c.problem + '</p>' +
          '<div class="list-meta">' + toolTags + '</div>' +
          '<div class="list-foot"><span>' + c.author + comingSoon + '</span><span>' + (c.timeBucket || "") + '</span></div>' +
        '</div>' +
      '</a>'
    );
  }

  function renderList(){
    var filtered = allCases.filter(matchesFilters);
    countEl.textContent = filtered.length + " of " + allCases.length + " use case" + (allCases.length === 1 ? "" : "s");
    if (filtered.length === 0){
      gridEl.innerHTML = '<div class="empty-state">No use cases match those filters yet.<br><button id="reset-empty" type="button">Clear filters</button></div>';
      var resetBtn = document.getElementById("reset-empty");
      if (resetBtn) resetBtn.addEventListener("click", clearFilters);
      return;
    }
    gridEl.innerHTML = filtered.map(listCardHTML).join("");
  }

  function clearFilters(){
    state = { type: "", time: "", q: state.q };
    typeSel.value = ""; timeSel.value = "";
    renderList();
  }
  document.getElementById("clear-filters").addEventListener("click", clearFilters);
  typeSel.addEventListener("change", function(){ state.type = typeSel.value; renderList(); });
  timeSel.addEventListener("change", function(){ state.time = timeSel.value; renderList(); });
  searchInput.addEventListener("input", function(){ state.q = searchInput.value; renderList(); });

  lightbox.addEventListener("click", function(){ lightbox.classList.remove("open"); lightboxImg.src = ""; });

  function initials(name){
    var parts = (name || "").trim().split(/\s+/);
    if (!parts[0]) return "?";
    return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }

  function renderDetail(id){
    var c = allCases.filter(function(x){ return x.id === id; })[0];
    if (!c){
      detailContent.innerHTML = '<button class="back-link" onclick="location.hash=\'\'">← Back to browse</button><p style="color:var(--ink-soft)">That use case isn\'t here — it may have moved.</p>';
      return;
    }
    var colorClass = typeColorMap[c.type] || "neutral";
    var typeChip = c.type ? '<span class="cat-chip ' + colorClass + '">' + c.type + '</span>' : "";

    var carouselIndex = 0;
    var hero = "";
    if (c.images.length){
      var arrows = c.images.length > 1
        ? '<button class="car-arrow car-prev" id="car-prev" aria-label="Previous image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>' +
          '<button class="car-arrow car-next" id="car-next" aria-label="Next image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>'
        : "";
      hero = '<div class="carousel" id="carousel"><img class="hero-shot" id="carousel-img" src="' + c.images[0] + '" alt="' + c.title + ' screenshot">' + arrows + '</div>';
      if (c.images.length > 1){
        hero += '<div class="car-dots" id="car-dots">' + c.images.map(function(_, i){
          return '<button class="car-dot' + (i === 0 ? ' active' : '') + '" data-i="' + i + '" aria-label="Image ' + (i+1) + '"></button>';
        }).join("") + '</div>';
      }
      if (c.imageLabel){
        hero += '<p class="image-caption">' + c.imageLabel + '</p>';
      }
    } else {
      hero = '<div class="hero-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Screenshot<span class="sub">No screenshot added yet</span></div>';
    }

    var metaPills = [c.timeBucket, c.level].concat(c.tools).filter(Boolean).map(function(m){ return '<span class="meta-pill">' + m + '</span>'; }).join("");

    var cards = "";
    if (c.build) cards += '<div class="detail-card"><h4>How it was built</h4><p>' + c.build + '</p></div>';
    if (c.outcome) cards += '<div class="detail-card"><h4>Outcome</h4><p>' + c.outcome + '</p></div>';
    if (c.lessons) cards += '<div class="detail-card"><h4>Lessons learned</h4><p>' + c.lessons + '</p></div>';
    if (c.timeDetail) cards += '<div class="detail-card"><h4>Time invested</h4><p>' + c.timeDetail + '</p></div>';

    var liUrl = AUTHOR_LINKS[c.author];
    var liLink = liUrl ? '<a class="li-link" href="' + liUrl + '" target="_blank" rel="noopener">View profile →</a>' : "";
    var submittedRow =
      '<div class="submitted-row">' +
        '<div class="avatar">' + initials(c.author) + '</div>' +
        '<div><div class="submitted-name">' + c.author + '</div><div class="submitted-label">Built this use case</div></div>' +
        liLink +
      '</div>';

    var howTo = "";
    if (c.howTo){
      var showLabel = c.howToLabel || "Show the full step-by-step guide";
      var hideLabel = c.howToLabel ? "Hide it" : "Hide the full guide";
      howTo =
        '<button class="howto-toggle" id="howto-btn" type="button" data-show="' + showLabel + '" data-hide="' + hideLabel + '">' + showLabel + '</button>' +
        '<div class="howto-panel" id="howto-panel"><div class="howto-content">' + renderMarkdown(c.howTo) + '</div></div>';
    }
    var downloadBtn = "";
    if (c.guideFileUrl){
      var label = c.guideFileLabel || "Download the full guide";
      downloadBtn =
        '<a class="download-btn" href="' + c.guideFileUrl + '" target="_blank" rel="noopener">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>' +
          label +
        '</a>';
    }

    detailContent.innerHTML =
      '<button class="back-link" onclick="location.hash=\'\'">← Back to browse</button>' +
      hero + typeChip +
      '<h1 class="detail-title">' + c.title + '</h1>' +
      '<p class="detail-problem">' + c.problem + '</p>' +
      '<div class="detail-meta-row">' + metaPills + '</div>' +
      cards + submittedRow + '<div style="height:16px"></div>' + howTo + downloadBtn;

    var btn = document.getElementById("howto-btn");
    var panel = document.getElementById("howto-panel");
    if (btn && panel){
      btn.addEventListener("click", function(){
        var open = panel.classList.toggle("open");
        btn.textContent = open ? btn.getAttribute("data-hide") : btn.getAttribute("data-show");
      });
    }
    detailContent.querySelectorAll(".hero-shot").forEach(function(img){
      img.addEventListener("click", function(){ lightboxImg.src = img.src; lightbox.classList.add("open"); });
    });

    if (c.images.length > 1){
      var carImg = document.getElementById("carousel-img");
      var dots = detailContent.querySelectorAll(".car-dot");
      function goTo(i){
        carouselIndex = (i + c.images.length) % c.images.length;
        carImg.src = c.images[carouselIndex];
        dots.forEach(function(d, di){ d.classList.toggle("active", di === carouselIndex); });
      }
      var prevBtn = document.getElementById("car-prev");
      var nextBtn = document.getElementById("car-next");
      if (prevBtn) prevBtn.addEventListener("click", function(){ goTo(carouselIndex - 1); });
      if (nextBtn) nextBtn.addEventListener("click", function(){ goTo(carouselIndex + 1); });
      dots.forEach(function(d){ d.addEventListener("click", function(){ goTo(parseInt(d.getAttribute("data-i"), 10)); }); });

      var carouselEl = document.getElementById("carousel");
      var touchStartX = null;
      carouselEl.addEventListener("touchstart", function(e){ touchStartX = e.touches[0].clientX; }, { passive: true });
      carouselEl.addEventListener("touchend", function(e){
        if (touchStartX === null) return;
        var dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 40){ goTo(dx > 0 ? carouselIndex - 1 : carouselIndex + 1); }
        touchStartX = null;
      });
    }
    window.scrollTo(0, 0);
  }

  function route(){
    var h = location.hash;
    var m = h.match(/^#\/case\/(.+)$/);
    if (m){
      viewList.style.display = "none";
      viewDetail.style.display = "block";
      renderDetail(m[1]);
    } else {
      viewDetail.style.display = "none";
      viewList.style.display = "block";
    }
  }
  window.addEventListener("hashchange", route);

  function showStatus(msg, isError){ statusEl.textContent = msg; statusEl.className = isError ? "error" : ""; }
  function loadFromCache(){ try { var c = localStorage.getItem(STORAGE_KEY); return c ? JSON.parse(c) : null; } catch(e){ return null; } }
  function saveToCache(rows){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(rows)); } catch(e){} }

  function init(rows, fromCache){
    allCases = normalizeRows(rows);
    assignTypeColors();
    setupFilters();
    if (allCases.length === 0 && allCases.hiddenIncomplete === 0 && allCases.hiddenDraft === 0){
      showStatus("No use cases published yet — check back soon.", false);
    } else if (fromCache){
      showStatus("Showing the last saved version — couldn't reach the live sheet just now.", true);
    } else if (allCases.hiddenIncomplete > 0){
      showStatus(allCases.hiddenIncomplete + " entr" + (allCases.hiddenIncomplete === 1 ? "y is" : "ies are") + " saved but not shown yet — fill in Title, Type, Problem, Tools, and TimeBucket, then set Status to Live.", true);
    } else {
      showStatus("");
    }
    renderList();
    route();
  }

  if (!SHEET_CSV_URL || SHEET_CSV_URL.indexOf("PASTE_YOUR") === 0){
    showStatus("This site isn't connected to a data sheet yet. See SETUP-GUIDE.md.", true);
    countEl.textContent = "0 use cases";
    return;
  }

  Papa.parse(SHEET_CSV_URL, {
    download: true, header: true, skipEmptyLines: true,
    complete: function(results){ saveToCache(results.data); init(results.data, false); },
    error: function(){
      var cached = loadFromCache();
      if (cached){ init(cached, true); }
      else { showStatus("Couldn't load use cases and no saved version was found. Check your connection and try again.", true); countEl.textContent = "0 use cases"; }
    }
  });
})();
</script>
</body>
</html>
